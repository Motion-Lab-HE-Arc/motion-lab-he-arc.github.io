# -- Site Configuration --
# Refer to the theme docs for more details about each of these parameters.
# https://nunocoracao.github.io/blowfish/docs/getting-started/

theme = "blowfish"
baseURL = "https://motion-lab-he-arc.github.io/"
defaultContentLanguage = "fr"

enableRobotsTXT = true
[pagination]
pagerSize = 100
summaryLength = 0

buildDrafts = false
buildFuture = false

enableEmoji = true

googleAnalytics = "G-MZX6C3PLW3"

[taxonomies]
  tag = "tags"
  category = "categories"
  author = "authors"
  series = "series"

[sitemap]
  changefreq = 'daily'
  filename = 'sitemap.xml'
  priority = 0.5

[outputs]
  home = ["HTML", "RSS", "JSON"]
  page = ["HTML", "print"]   # print.html : version imprimable des pages taguées « poster »

[outputFormats.print]
  mediaType = "text/html"
  baseName = "print"
  isHTML = true
  notAlternative = true

[caches]
[caches.images]
dir = ':cacheDir/images'